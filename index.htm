<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Added viewport-fit=cover for full immersion on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>The Infinite Verse</title>
  
  <!-- Load Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- Load Lottie Library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.13/lottie.min.js"></script>

  <style>
    :root {
      /* --- PALETTE: RED, BLUE, PURPLE, BLACK --- */
      --deep-black: #000000;
      
      /* Vibrant shades for accents */
      --neon-blue: #60a5fa;
      --neon-purple: #c084fc;
      --neon-red: #f87171;
      --gold: #fbbf24;
      
      /* Gradient for the reel text */
      --sunset-gradient: linear-gradient(to bottom, var(--neon-blue), var(--neon-purple), var(--neon-red));
      --legendary-gradient: linear-gradient(to bottom, var(--gold), var(--neon-purple), var(--gold));
    }

    * { box-sizing: border-box; }
    
    body, html { 
      margin: 0; padding: 0; height: 100%; width: 100%; 
      background: #000; /* Deep black fallback */
      color: #e0f2fe; 
      font-family: 'Poppins', sans-serif; 
      overflow: hidden; cursor: crosshair; 
      overscroll-behavior: none;
    }

    /* --- Native Video Background (Dropbox Ready) --- */
    #bgVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; 
      height: 100vh;
      /* Ensures the video covers the screen like a wallpaper */
      object-fit: cover; 
      z-index: 0;
      pointer-events: none;
      opacity: 0; 
      transition: opacity 2.5s ease-in;
      /* Hardware acceleration to reduce lag */
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* Overlay to darken video slightly so text pops */
    .video-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.2); /* Slight tint for readability */
      z-index: 0; pointer-events: none;
    }

    /* --- Error Notification --- */
    #errorMsg {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(255, 0, 0, 0.8); color: white;
      padding: 10px 20px; border-radius: 5px;
      display: none; z-index: 5000; font-size: 12px;
      pointer-events: none;
    }

    /* --- Loader --- */
    #loader {
      position: fixed; inset: 0; background: var(--deep-black); z-index: 2000;
      display: flex; align-items: center; justify-content: center; 
      flex-direction: column; text-align: center; padding: 40px;
      transition: opacity 1s ease-out;
    }
    #beginBtn { 
      padding: 15px 40px; 
      background: transparent; 
      color: var(--neon-blue); 
      border: 2px solid var(--neon-purple); 
      cursor: pointer; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.2);
      /* Initially hidden until video is ready */
      opacity: 0; pointer-events: none; transform: translateY(20px);
    }
    #beginBtn.ready {
      opacity: 1; pointer-events: auto; transform: translateY(0);
    }
    #beginBtn:hover { 
      background: var(--neon-purple); 
      color: black;
      box-shadow: 0 0 30px var(--neon-purple);
      transform: scale(1.05); 
    }
    
    .loading-status {
        margin-top: 20px;
        color: var(--neon-blue);
        font-size: 12px;
        opacity: 0.7;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    .loader-text {
      font-family: 'Great Vibes', cursive; font-size: clamp(1.4rem, 4vw, 2.5rem);
      max-width: 900px; line-height: 1.6; opacity: 0; display: none;
      text-shadow: 0 2px 4px black;
    }
    @keyframes cinematicFade {
      0% { opacity: 0; transform: translateY(20px); color: var(--neon-blue); }
      20% { opacity: 1; transform: translateY(0); }
      40% { color: var(--neon-red); }
      70% { color: var(--neon-purple); opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); visibility: hidden; }
    }

    /* --- Layout --- */
    .main { display: flex; height: 100vh; width: 100vw; opacity: 0; transition: 2s; position: relative; z-index: 1;}
    
    .left { 
      width: 40%; height: 100%; 
      background: transparent; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .right { 
      width: 60%; height: 100%; display: flex; align-items: center; justify-content: center; 
      padding: 40px 60px; text-align: center; overflow-y: auto;
      background: transparent;
      position: relative;
    }

    /* --- Reel & Text Visibility --- */
    .jackpot-box { 
      width: 100%; height: 350px; overflow: hidden; position: relative; 
      background: transparent;
      mask-image: linear-gradient(transparent, black 20%, black 80%, transparent); 
      -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent); 
    }
    .reel { position: absolute; width: 100%; top: 0; left: 0; will-change: transform; }
    
    .item { 
      height: 70px; display: flex; align-items: center; justify-content: center; 
      font-weight: 800; text-transform: uppercase; letter-spacing: 4px; 
      font-size: 14px; 
      background: var(--sunset-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 0px rgba(0,0,0,1));
      transition: opacity 0.3s;
    }
    
    .reel.spinning .item {
        background: linear-gradient(to bottom, #fff, var(--neon-blue), #fff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        opacity: 0.7;
    }

    .shuffle-wrapper { position: relative; margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    
    .btn { 
      padding: 12px 25px; 
      background: rgba(0, 0, 0, 0.5); 
      color: var(--neon-blue); 
      border: 1px solid var(--neon-purple); 
      cursor: pointer; letter-spacing: 2px; transition: 0.25s; text-transform: uppercase; 
      font-size: 11px; font-weight: bold; 
      backdrop-filter: blur(4px);
    }
    .btn:hover, .btn.active { 
      background: var(--neon-red); 
      color: black; 
      border-color: var(--neon-red);
      box-shadow: 0 0 15px var(--neon-red);
    }

    #redButterflyContainer { 
      position: absolute; width: 130px; height: 130px; bottom: -65px; right: -65px; 
      pointer-events: none; z-index: 10; opacity: 0; transition: opacity 1s; 
    }
    
    #blueFollowerContainer { 
      position: fixed; width: 110px; height: 110px; z-index: 9999; pointer-events: none; 
      top: 0; left: 0; will-change: transform; opacity: 0; transition: opacity 2s; 
    }

    .controls { display:flex; gap:10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 300px; }

    /* --- Poem Output (The Main Event) --- */
    .poem-out {
      font-family: 'Great Vibes', cursive; font-size: clamp(2rem, 4.5vw, 3rem); 
      opacity: 0; transition: opacity 0.5s ease; line-height: 1.4;
      background: var(--sunset-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200%;
      animation: metal 8s linear infinite;
      filter: drop-shadow(0 2px 2px black);
      white-space: pre-wrap;
    }
    .poem-out.active { 
      opacity: 1; 
      background: transparent !important; 
      -webkit-background-clip: unset; -webkit-text-fill-color: unset;
      color: #fff; /* White text for max contrast */
      display: inline-block;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.5);
    }

    /* Legendary Styling (Purple Poems) */
    .poem-out.legendary {
        background: var(--legendary-gradient) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        text-shadow: 0 0 20px rgba(192, 132, 252, 0.6), 0 2px 5px black !important;
        filter: drop-shadow(0 0 5px var(--gold));
    }

    /* Particles */
    .particle {
        position: absolute;
        width: 6px; height: 6px;
        background: var(--gold);
        border-radius: 50%;
        pointer-events: none;
        z-index: 100;
    }
    @keyframes explode {
        0% { transform: translate(0,0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    @keyframes metal { to { background-position: 200% center; } }
  </style>
</head>
<body>

<div id="errorMsg">Error Loading Files. Check Console (F12).</div>
<div id="blueFollowerContainer"><div id="lFollow" style="width:100%; height:100%;"></div></div>

<!-- NATIVE VIDEO PLAYER (Highest Quality) -->
<!-- Added extra playsinline attributes for broad mobile support -->
<video id="bgVideo" playsinline webkit-playsinline x5-playsinline muted loop preload="auto">
    <!-- Source set via JS -->
</video>
<div class="video-overlay"></div>

<div id="loader">
  <button id="beginBtn">Begin Experience</button>
  <div id="statusText" class="loading-status">Connecting to High-Res Stream...</div>
  <div id="lText" class="loader-text">
    "The ocean drifts like endless tides across quiet skies, soft currents carrying whispers of hidden worlds... In the endless sky, ocean and ember bloom together, vivid and alive."
  </div>
</div>

<div class="main" id="main">
  <div class="left">
    <div class="jackpot-box"><div class="reel" id="reel"></div></div>
    <div class="shuffle-wrapper">
        <button class="btn" style="width:220px;" onclick="shuffle()">Shuffle Reel</button>
        <button class="btn" id="zenBtn" style="width:220px;" onclick="toggleZenMode()">Zen Mode: Off</button>
        
        <div class="controls">
            <button class="btn" id="musicToggleBtn" onclick="toggleMusic()">Music: Off</button>
            <button class="btn" onclick="prevSong()">Prev</button>
            <button class="btn" onclick="nextSong()">Next</button>
        </div>
        <div id="redButterflyContainer"><div id="lRed" style="width:100%; height:100%;"></div></div>
    </div>
  </div>
  <div class="right"><div id="poemOut" class="poem-out"></div></div>
</div>

<audio id="player"></audio>

<script>
  // --- CONFIGURATION ---
  // Updated with your Dropbox Link (using raw=1 for streaming)
  const HIGH_RES_VIDEO_URL = "https://www.dropbox.com/scl/fi/p10ag7e1we5jpfd9u0ht4/forest.mp4?rlkey=uspja02o7gaxd9c6vnwdcqjpe&st=vtxqdqaz&raw=1"; 
  
  function showError(msg) {
    console.error(msg);
    const errBox = document.getElementById('errorMsg');
    errBox.innerText = msg;
    errBox.style.display = 'block';
    setTimeout(() => errBox.style.display = 'none', 5000);
  }

  // --- 1. Native Video Logic ---
  const video = document.getElementById('bgVideo');
  const beginBtn = document.getElementById('beginBtn');
  const statusText = document.getElementById('statusText');

  video.src = HIGH_RES_VIDEO_URL;

  // Wait for video data to ensure quality playback
  video.addEventListener('canplay', () => {
    console.log("Video ready to play");
    statusText.innerText = "Environment Ready";
    beginBtn.classList.add('ready');
  });

  // Fallback if video takes too long (so user isn't stuck)
  setTimeout(() => {
      if(!beginBtn.classList.contains('ready')) {
          statusText.innerText = "Click to Start";
          beginBtn.classList.add('ready');
      }
  }, 4000);

  // --- 2. Begin Experience ---
  beginBtn.onclick = function() {
    // FORCE FULLSCREEN
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(err => console.log("Fullscreen denied:", err));
    } else if (elem.webkitRequestFullscreen) { /* Safari */
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
      elem.msRequestFullscreen();
    }

    this.style.opacity = '0';
    this.style.pointerEvents = 'none';
    statusText.style.display = 'none';
    
    const text = document.getElementById('lText');
    text.style.display = 'block';
    text.style.animation = 'cinematicFade 10s forwards ease-in-out';
    
    // Play Audio
    updateTrack();
    toggleMusic(true);
    
    // Play Video (User Interaction Required for Mobile)
    video.play().then(() => {
        // Video playing smoothly
        video.style.opacity = '1';
    }).catch(err => {
        console.warn("Video play error:", err);
        // Ensure background is visible even if video fails
        video.style.opacity = '1'; 
    });

    setTimeout(() => {
      document.getElementById('loader').style.opacity = '0'; // Fade out loader
      setTimeout(() => document.getElementById('loader').style.display = 'none', 1000); // Remove from DOM
      
      document.getElementById('main').style.opacity = '1';
      document.getElementById('blueFollowerContainer').style.opacity = '1'; 
      document.getElementById('redButterflyContainer').style.opacity = '1';
    }, 10000);
  };

  // --- Lottie & Other Assets ---
  let followAnim, redAnim;

  try {
    followAnim = lottie.loadAnimation({ 
      container: document.getElementById('lFollow'), 
      renderer: 'svg', loop: true, autoplay: true, 
      path: 'blue.json' 
    });
  } catch(e) { showError("Error initializing Blue Butterfly"); }

  try {
    redAnim = lottie.loadAnimation({ 
      container: document.getElementById('lRed'), 
      renderer: 'svg', loop: true, autoplay: true, 
      path: 'red.json' 
    });
  } catch(e) { showError("Error initializing Red Butterfly"); }


  // --- Poems Data (All 128 Poems) ---
  const poems = [
    // --- PART I: THE BLUE MOVEMENT (97 Poems) ---
    { title: "Blue, Remaining", text: "You stay where moments usually leave,<br>Lingering longer than they believe.<br>The air shifts slower when you’re near,<br>As if time learns patience here." },
    { title: "Quiet Undertow", text: "You pull like water beneath the calm,<br>Not enough to drown, enough to palm.<br>There’s motion hidden in your rest,<br>A silent strength that knows its best." },
    { title: "Blue, Unhurried", text: "You walk like nothing waits ahead,<br>No past behind you begging to be read.<br>Each step exists for just that step,<br>No borrowed weight, no future debt." },
    { title: "After the Noise", text: "You arrive once echoes fade,<br>Where sharp thoughts finally unbraid.<br>The mind unclenches, breath returns,<br>Nothing demands, nothing burns." },
    { title: "Blue, Contained", text: "You don’t spill over, don’t retreat,<br>You hold yourself complete.<br>There’s comfort in your measured sway,<br>In knowing you won’t drift away." },
    { title: "Low Tide Thought", text: "You think like waves when they withdraw,<br>Leaving patterns without flaw.<br>Nothing chases what has gone,<br>The shore accepts, the sea moves on." },
    { title: "Blue, Familiar", text: "You feel remembered, not brand new,<br>Like skies the heart already knew.<br>No introductions need be said,<br>You settle where the mind has read." },
    { title: "Still Current", text: "You move without disturbing shape,<br>A quiet flow that doesn’t scrape.<br>Resistance fails to find its grip,<br>Tension loosens, starts to slip." },
    { title: "Blue, Weighted", text: "You carry depth like settled rain,<br>Heavy, but free of pain.<br>No pressure bends the way you stand,<br>You rest complete, not unplanned." },
    { title: "Where Calm Persists", text: "You exist past the need for proof,<br>Beyond the noise, beneath the roof.<br>The world forgets to ask you why,<br>It simply rests as you pass by." },
    { title: "Blue, Undisturbed", text: "You remain where pressure fails,<br>Where urgency quietly derails.<br>No force convinces you to bend,<br>You hold your ground without an end." },
    { title: "Silent Reach", text: "You touch without needing to claim,<br>Leaving warmth without a name.<br>The space remembers where you pass,<br>Not for speed, but for how long it lasts." },
    { title: "Blue, Balanced", text: "You don’t tip toward loss or gain,<br>You hold the middle of the day.<br>No lean toward loss or gain,<br>You loosen pleasure, ease the pain." },
    { title: "After the Pull", text: "You exist once desire sleeps,<br>When wanting loosens what it keeps.<br>No hunger shapes the way you are,<br>You don’t measure near or far." },
    { title: "Blue, Grounded", text: "You don’t float off or sink below,<br>You hold the line where thoughts slow.<br>There’s trust in how you stay aware,<br>Present without a need for care." },
    { title: "Soft Continuum", text: "You feel like time that doesn’t cut,<br>Where seconds open instead of shut.<br>No sharp before, no harsh after,<br>Just steady being, quieter laughter." },
    { title: "Blue, Unclaimed", text: "You don’t belong to what has passed,<br>Nor chase the shape of what won’t last.<br>You stay untouched by grasp or fear,<br>Whole enough just standing here." },
    { title: "Held Horizon", text: "You live where distance loses form,<br>Neither shelter nor the storm.<br>The edge dissolves into your view,<br>Nothing decides what’s old or new." },
    { title: "Blue, Settling", text: "You arrive like dust after light,<br>Gently landing, not asking right.<br>The room adjusts without a sound,<br>As if it knew you’d come around." },
    { title: "Quiet Weightlessness", text: "You carry nothing that drags you down,<br>Yet depth surrounds you all around.<br>There’s gravity without the strain,<br>A presence felt but hard to name." },
    { title: "Blue, Still Arriving", text: "You don’t enter — you unfold,<br>Like warmth easing into cold.<br>No edge announces where you start,<br>You settle first in the heart." },
    { title: "Unforced Depth", text: "You don’t descend to prove how far,<br>You deepen simply as you are.<br>No markers show where surface ends,<br>The quiet keeps its own amends." },
    { title: "Blue, Pendulum", text: "You move at a pace that time respects,<br>Leaving space where it expects.<br>No second feels misplaced or late,<br>You loosen the grip of fate." },
    { title: "Quiet Center", text: "You live where motion finds its core,<br>Neither needing less nor more.<br>The pull dissolves around your frame,<br>Nothing asks you to remain." },
    { title: "Blue, Untouched", text: "You pass through moments without bruise,<br>Not because you hide, but choose.<br>You let the sharpness lose its claim,<br>You don’t absorb what tries to name." },
    { title: "After the Echo", text: "You exist once the sound lets go,<br>When meaning settles into low.<br>No repetition pulls you back,<br>You stay beyond the final crack." },
    { title: "Blue, Even", text: "You don’t rise high or sink away,<br>You hold the middle of the day.<br>No lean toward loss or gain,<br>You loosen pleasure, ease the pain." },
    { title: "Soft Gravity", text: "You pull without intent or need,<br>No forceful draw, no promised speed.<br>The room aligns around your tone,<br>As if it knew where to belong." },
    { title: "Blue, Continuous", text: "You don’t reset or start again,<br>You move like breath without an end.<br>No sharp divide between before,<br>Just flowing into something more." },
    { title: "Unmarked Water", text: "You leave no trail yet change the shape,<br>Like tide that doesn’t need a name.<br>The shore remembers what you did,<br>Even after it’s erased or hid." },
    { title: "Blue, Holding", text: "You don’t grip tight or let things fall,<br>You hold without control at all.<br>The strain dissolves inside your stay,<br>Nothing feels forced to go or play." },
    { title: "Quiet Alignment", text: "You bring things into subtle line,<br>Without a rule, without a sign.<br>The pieces shift because you’re near,<br>Not from reason, not from fear." },
    { title: "Blue, Echoed", text: "You feel remembered, not recalled,<br>Like something known before the fall.<br>No effort goes into your name,<br>You settle in just all the same." },
    { title: "Submerged Flow", text: "You move beneath the quiet skin,<br>Not still at all, just held within.<br>No splash announces what you do,<br>You change direction slowly, true." },
    { title: "Blue, Unpressured", text: "You don’t respond to force or plea,<br>You open only when it’s free.<br>No push determines where you bend,<br>You stay intact, you don’t contend." },
    { title: "After Wanting", text: "You appear once hunger fades,<br>When need loosens all its trades.<br>No ache directs the way you stay,<br>You don’t improve or drift away." },
    { title: "Blue, Centered Light", text: "You don’t shine out or pull apart,<br>You glow like balance in the dark.<br>The shadow learns how not to press,<br>The light forgets to overstep." },
    { title: "Quiet Agreement", text: "You feel like things finally align,<br>Not by logic, not by sign.<br>The moment nods and settles in,<br>No argument left to win." },
    { title: "Blue, Unbroken Flow", text: "You don’t stop when edges form,<br>You bend around them, smooth and warm.<br>No fracture marks where pressure grew,<br>You carry shape without the bruise." },
    { title: "Where Ease Lives", text: "You exist where effort ends,<br>Where nothing needs to prove or bend.<br>The breath deepens on its own,<br>The body feels less overgrown." },
    { title: "Blue, Unfading", text: "You don’t weaken with passing hours,<br>You hold your tone through shifting powers.<br>No moment steals what you contain,<br>You stay consistent through the change." },
    { title: "Quiet Latitude", text: "You exist between extremes of thought,<br>Where nothing needs to be overwrought.<br>No pull insists you choose a side,<br>You stay where truths can coincide." },
    { title: "Blue, Unweighted", text: "You don’t carry borrowed load,<br>You travel light on every road.<br>No memory drags behind your feet,<br>You meet the present fully complete." },
    { title: "Still Between", text: "You rest where motion learns to pause,<br>Not from force, not from cause.<br>The shift happens without command,<br>Like sand arranging into land." },
    { title: "Blue, Unforced Light", text: "You don’t glow to be perceived,<br>You shine because you’re unconceived.<br>No angle begs the eye to stay,<br>You’re visible in a quieter way." },
    { title: "After the Edge", text: "You appear once tension drops,<br>When thought releases all its knots.<br>No sharpness follows where you land,<br>The world softens on command." },
    { title: "Blue, Undivided", text: "You don’t split what feels unsure,<br>You hold it whole and let it endure.<br>No side outweighs the other’s stay,<br>You let both breathe without decay." },
    { title: "Soft Constant", text: "You remain while things rotate,<br>Unaffected by their weight.<br>No shift convinces you to bend,<br>You stay consistent without defend." },
    { title: "Blue, Unclaimed Space", text: "You live where ownership dissolves,<br>Where nothing asks, nothing absolves.<br>No label fits the way you stay,<br>You exist outside display." },
    { title: "Quiet Alignment II", text: "You realign without a sound,<br>The pieces settle all around.<br>No force directs where they belong,<br>They find their place because you’re strong." },
    { title: "Blue, Continuous Rest", text: "You don’t arrive then disappear,<br>You stay like breath, always here.<br>No peak announces where you end,<br>You flow without a need to mend." },
    { title: "Held Silence", text: "You don’t empty what goes quiet,<br>You fill it without riot.<br>No absence sharpens in your wake,<br>The hush feels whole, not fake." },
    { title: "Blue, Untethered", text: "You don’t drift off or pull away,<br>You stay without a need to stay.<br>No anchor keeps you in your place,<br>No wind persuades you into space." },
    { title: "After the Rush", text: "You arrive when urgency sleeps,<br>When speed releases what it keeps.<br>No echo of the sprint remains,<br>The pulse forgets its former strain." },
    { title: "Blue, Even Depth", text: "You don’t darken as you go,<br>You stay consistent below.<br>No sudden drop, no hidden floor,<br>You deepen evenly, nothing more." },
    { title: "Quiet Permission", text: "You allow without request,<br>You let the moment do the rest.<br>No rules define what’s meant to be,<br>You open space for things to breathe." },
    { title: "Blue, Settled Core", text: "You don’t shift when layers move,<br>You stay beneath what tries to prove.<br>No surface change persuades your stay,<br>You hold the base in quiet way." },
    { title: "Soft Continuance", text: "You don’t stop to start again,<br>You carry through without a bend.<br>No moment asks you to reset,<br>You flow without regret." },
    { title: "Blue, Unending Ease", text: "You don’t promise rest or release,<br>You simply let the tension cease.<br>No finish line defines your stay,<br>You ease the way without delay." },
    { title: "Blue, Unrushed Ground", text: "You don’t hurry what already fits,<br>You wait where meaning gently sits.<br>No second feels like it’s behind,<br>You loosen time inside the mind." },
    { title: "Quiet Equator", text: "You live where opposites agree,<br>Where heat and cool share symmetry.<br>No side overwhelms the other’s stay,<br>You let them breathe the same long way." },

  const list = []; 
  for(let i=0; i<300; i++) list.push(poems[i % poems.length]);
  
  const tracks = ['s1.mp3', 's2.mp3', 's3.mp3', 's4.mp3', 's5.mp3', 's6.mp3', 's7.mp3', 's8.mp3'];
  let trackIdx = 0; 
  let isPlaying = false;
  const player = document.getElementById('player');
  
  function updateTrack() { 
    player.src = tracks[trackIdx]; 
    if(isPlaying) player.play().catch(e => console.log("Audio waiting")); 
  }
  
  function toggleMusic(forcePlay = false) {
      if (forcePlay) {
          isPlaying = true;
          player.play();
      } else {
          if (player.paused) {
              player.play();
              isPlaying = true;
          } else {
              player.pause();
              isPlaying = false;
          }
      }
      document.getElementById('musicToggleBtn').innerText = isPlaying ? "Music: On" : "Music: Pause";
  }
  
  function nextSong() { trackIdx = (trackIdx + 1) % tracks.length; updateTrack(); }
  function prevSong() { trackIdx = (trackIdx - 1 + tracks.length) % tracks.length; updateTrack(); }
  player.onended = () => nextSong();

  const reel = document.getElementById('reel');
  reel.innerHTML = list.map(p => `<div class="item">${p.title}</div>`).join('');
  let spinning = false;

  function shuffle() {
    if(spinning) return; spinning = true;
    
    // 1. Change reel text color while spinning
    reel.classList.add('spinning');
    
    const stopIdx = Math.floor(Math.random() * (list.length - 20)) + 10;
    const offset = stopIdx * 70;
    reel.style.transition = 'transform 6s cubic-bezier(0.16, 1, 0.3, 1)';
    reel.style.transform = `translateY(-${offset}px)`;
    
    const poemEl = document.getElementById('poemOut');
    poemEl.classList.remove('active', 'legendary');
    poemEl.innerHTML = ""; // Clear for typewriter
    
    setTimeout(() => {
      // Stop spinning visuals
      reel.classList.remove('spinning');
      reel.style.transition = 'none'; // reset pos invisible
      
      const poem = list[stopIdx];
      const isLegendary = poem.title.startsWith("Purple");
      
      // Particle Explosion if Legendary
      if(isLegendary) {
          poemEl.classList.add('legendary');
          createParticles(window.innerWidth / 2 + 300, window.innerHeight / 2);
      }
      
      poemEl.classList.add('active');
      typewriter(poem.text, poemEl);
      
      spinning = false;
    }, 6000);
  }
  
  function typewriter(html, element) {
      // A simple HTML-aware typewriter
      // We'll strip tags for typing logic or just render raw HTML if simple
      // Since poems use <br>, let's just fade text in to keep <br> working easily
      // OR better: Type plain text. The user poems use <br>.
      // Let's use a fade-in word by word or letter for "reveal" effect.
      // Simpler approach for HTML content:
      element.innerHTML = html;
      element.style.opacity = 0;
      let opacity = 0;
      const fadeInt = setInterval(() => {
          opacity += 0.05;
          element.style.opacity = opacity;
          if(opacity >= 1) clearInterval(fadeInt);
      }, 50);
  }

  // Override typewriter with actual character reveal for cleaner text
  function typewriter(htmlText, element) {
      element.innerHTML = "";
      element.style.opacity = 1;
      
      // Temporary container to parse HTML
      let temp = document.createElement('div');
      temp.innerHTML = htmlText;
      let nodes = Array.from(temp.childNodes);
      
      let cursor = 0;
      
      function typeNode() {
          if(cursor >= nodes.length) return;
          let node = nodes[cursor];
          
          if(node.nodeType === 3) { // Text node
              let text = node.textContent;
              let i = 0;
              let span = document.createElement('span');
              element.appendChild(span);
              
              let timer = setInterval(() => {
                  span.textContent += text[i];
                  i++;
                  if(i >= text.length) {
                      clearInterval(timer);
                      cursor++;
                      typeNode();
                  }
              }, 30); // Speed
          } else {
              // Element node (likely <br>)
              element.appendChild(node.cloneNode(true));
              cursor++;
              setTimeout(typeNode, 100); // Slight pause at line break
          }
      }
      typeNode();
  }

  function createParticles(x, y) {
      for(let i=0; i<40; i++) {
          let p = document.createElement('div');
          p.className = 'particle';
          document.body.appendChild(p);
          
          let angle = Math.random() * Math.PI * 2;
          let velocity = Math.random() * 150 + 50;
          let tx = Math.cos(angle) * velocity + 'px';
          let ty = Math.sin(angle) * velocity + 'px';
          
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.style.setProperty('--tx', tx);
          p.style.setProperty('--ty', ty);
          
          p.style.animation = `explode 1s ease-out forwards`;
          
          setTimeout(() => p.remove(), 1000);
      }
  }
  
  // Zen Mode Logic
  let zenInterval;
  let isZen = false;
  function toggleZenMode() {
      const btn = document.getElementById('zenBtn');
      if(isZen) {
          clearInterval(zenInterval);
          btn.innerText = "Zen Mode: Off";
          btn.classList.remove('active');
          isZen = false;
      } else {
          shuffle(); // Start immediately
          zenInterval = setInterval(() => {
              if(!spinning) shuffle();
          }, 15000);
          btn.innerText = "Zen Mode: On";
          btn.classList.add('active');
          isZen = true;
      }
  }

  const bFollow = document.getElementById('blueFollowerContainer');
  let bx = innerWidth/2, by = innerHeight/2, tx = bx, ty = by, isResting = false, isClick = false, restT;
  
  function animate() {
    if (!isResting) {
        let dx = tx - bx, dy = ty - by, dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 5) {
            if(isClick) { isClick = false; isResting = true; restT = setTimeout(() => isResting = false, 5000); }
            else { tx = Math.random()*innerWidth; ty = Math.random()*innerHeight; }
        }
        bx += dx * 0.025; by += dy * 0.025;
    }
    const tilt = (tx - bx) * 0.05;
    bFollow.style.transform = `translate3d(${bx-55}px, ${by-55}px, 0) rotate(${tilt}deg)`;
    requestAnimationFrame(animate);
  }
  animate();
  
  document.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    tx = e.clientX; ty = e.clientY; isClick = true; isResting = false; clearTimeout(restT);
  });
